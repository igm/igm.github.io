name: deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Publish to gh-pages
        run: |
          # keep repo plumbing out of the published site
          git rm -r -q --ignore-unmatch .github .gitignore README.md post/_template
          git checkout --orphan gh-pages-deploy
          git commit -m "Deploy $(git rev-parse --short HEAD) to gh-pages"
          git push -f origin gh-pages-deploy:gh-pages
