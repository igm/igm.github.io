name: deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Publish to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          SHA="$(git rev-parse --short HEAD)"

          # keep repo plumbing out of the published site
          git rm -r -q --ignore-unmatch .github .gitignore README.md post/_template
          git checkout --orphan gh-pages-deploy
          git add -A
          git commit -q -m "Deploy $SHA to gh-pages"
          git push -f origin gh-pages-deploy:gh-pages
